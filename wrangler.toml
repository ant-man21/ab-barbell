# Cloudflare Worker for A/B Barbell: serves the app from ./app and runs the /api server.
name = "ab-barbell"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./app"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[vars]
# Set to "false" once your own account exists to stop anyone else signing up.
ALLOW_SIGNUPS = "false"

[[durable_objects.bindings]]
name = "DIR"
class_name = "Directory"

[[durable_objects.bindings]]
name = "USER"
class_name = "UserStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Directory", "UserStore"]
